<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Card de Presentación Personal</h1>
    <br>
    <div class="card" style="width: 18rem;">
        <div class="img1">
            <img src="fondo.png" class="card-img-top" alt="">
        </div>
        <div class="img2">
            <img src="img.jpeg" class="card-img-top" alt="">
        </div>
        <div class="card-body">
            <h5 class="card-title">Danna Sofia Salamanca Obando</h5>
            <p class="card-text">Desarroladora Backend </p>
            <div class="socials">
                <i class="fa fa-linkedin"></i>
                <i class="fa fa-github"></i>
                <i class="fa fa-email"></i>
            </div>
            <a href="#" class="btn btn-primary">Go somewhere</a>

        </div>
    </div>

</body>

</html>
